spring.profiles.active=dev
spring.application.name=RentFlow

# Server
server.port=8080
server.servlet.context-path=/api

# JWT Configuration
jwt.secret=RentFlowSecretKeyForJWTTokenGenerationAndValidationPurposesOnly
jwt.expiration=86400000

# Default profile (dev) - Override with spring.profiles.active=prod for production
spring.datasource.url=jdbc:h2:mem:rentflowdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.rentflow=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# H2 Console (Development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway
spring.flyway.enabled=false
